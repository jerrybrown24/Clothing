<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ThreadMine Assistant</title>
<style>
  :root {
    --bg: #faf9f7;
    --panel: #ffffff;
    --border: #e5e1db;
    --text: #2b2a27;
    --muted: #7a756c;
    --accent: #c15f3c;
    --accent-hover: #a84e2f;
    --bubble-user: #eee7db;
    --bubble-bot: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1c1b19;
      --panel: #242320;
      --border: #38352f;
      --text: #eae6dd;
      --muted: #a39c8e;
      --accent: #d97a52;
      --accent-hover: #e88b63;
      --bubble-user: #34302a;
      --bubble-bot: #2a2926;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1c1b19;
    --panel: #242320;
    --border: #38352f;
    --text: #eae6dd;
    --muted: #a39c8e;
    --accent: #d97a52;
    --accent-hover: #e88b63;
    --bubble-user: #34302a;
    --bubble-bot: #2a2926;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }

  .app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    max-width: 780px;
    margin: 0 auto;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
  }

  header h1 {
    font-size: 16px;
    font-weight: 600;
    margin: 0;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  header h1 .dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--accent);
    display: inline-block;
  }

  header button {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 13px;
    cursor: pointer;
  }
  header button:hover { color: var(--text); border-color: var(--muted); }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px 16px 8px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .msg {
    max-width: 85%;
    padding: 10px 14px;
    border-radius: 14px;
    line-height: 1.5;
    font-size: 15px;
    white-space: pre-wrap;
    word-wrap: break-word;
  }

  .msg.user {
    align-self: flex-end;
    background: var(--bubble-user);
    border-bottom-right-radius: 4px;
  }

  .msg.bot {
    align-self: flex-start;
    background: var(--bubble-bot);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }

  .msg.error {
    align-self: flex-start;
    background: transparent;
    border: 1px solid #c15f3c;
    color: #c15f3c;
  }

  .msg.typing {
    align-self: flex-start;
    background: var(--bubble-bot);
    border: 1px solid var(--border);
    display: flex;
    gap: 4px;
    padding: 14px;
  }
  .msg.typing span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--muted);
    animation: blink 1.2s infinite ease-in-out;
  }
  .msg.typing span:nth-child(2) { animation-delay: 0.2s; }
  .msg.typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink {
    0%, 80%, 100% { opacity: 0.25; }
    40% { opacity: 1; }
  }

  .empty-state {
    margin: auto;
    text-align: center;
    color: var(--muted);
    padding: 24px;
  }
  .empty-state h2 {
    color: var(--text);
    font-size: 20px;
    margin-bottom: 6px;
  }
  .empty-state p { font-size: 14px; margin: 4px 0; }

  form#composer {
    display: flex;
    gap: 8px;
    padding: 12px 16px 16px;
    border-top: 1px solid var(--border);
    background: var(--bg);
  }

  #input {
    flex: 1;
    resize: none;
    max-height: 140px;
    padding: 12px 14px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    font-size: 15px;
    font-family: inherit;
  }
  #input:focus { outline: none; border-color: var(--accent); }

  #send {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 12px;
    padding: 0 18px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  #send:hover { background: var(--accent-hover); }
  #send:disabled { opacity: 0.5; cursor: not-allowed; }

  dialog#settings {
    border: none;
    border-radius: 14px;
    padding: 0;
    max-width: 420px;
    width: 90%;
    background: var(--panel);
    color: var(--text);
  }
  dialog#settings::backdrop { background: rgba(0,0,0,0.4); }
  .settings-body { padding: 20px; }
  .settings-body h2 { margin-top: 0; font-size: 17px; }
  .settings-body label {
    display: block;
    font-size: 13px;
    color: var(--muted);
    margin: 14px 0 6px;
  }
  .settings-body input, .settings-body select {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
  }
  .settings-body .hint {
    font-size: 12px;
    color: var(--muted);
    margin-top: 6px;
  }
  .settings-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    padding: 14px 20px;
    border-top: 1px solid var(--border);
  }
  .settings-actions button {
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 14px;
    cursor: pointer;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text);
  }
  .settings-actions button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1><span class="dot"></span>ThreadMine Assistant</h1>
    <button id="settingsBtn" type="button">Settings</button>
  </header>

  <div id="messages">
    <div class="empty-state" id="emptyState">
      <h2>Ask me anything</h2>
      <p>Add your Anthropic API key in Settings, then start chatting.</p>
      <p>Your key is stored only in this browser and sent directly to Anthropic.</p>
    </div>
  </div>

  <form id="composer">
    <textarea id="input" rows="1" placeholder="Message the assistant..." autocomplete="off"></textarea>
    <button id="send" type="submit">Send</button>
  </form>
</div>

<dialog id="settings">
  <div class="settings-body">
    <h2>Settings</h2>
    <label for="apiKey">Anthropic API key</label>
    <input id="apiKey" type="password" placeholder="sk-ant-..." autocomplete="off" />
    <div class="hint">Get a key at console.anthropic.com. Stored only in this browser's localStorage.</div>

    <label for="model">Model</label>
    <select id="model">
      <option value="claude-sonnet-5">Claude Sonnet 5</option>
      <option value="claude-opus-5-5">Claude Opus 5.5</option>
      <option value="claude-haiku-4-5-20251001">Claude Haiku 4.5</option>
    </select>

    <label for="systemPrompt">System prompt (optional)</label>
    <input id="systemPrompt" type="text" placeholder="You are a helpful assistant." />
  </div>
  <div class="settings-actions">
    <button type="button" id="clearChat">Clear chat</button>
    <button type="button" id="saveSettings" class="primary">Save</button>
  </div>
</dialog>

<script>
(function () {
  "use strict";

  var STORAGE_KEY = "threadmine_chat_history";
  var CONFIG_KEY = "threadmine_chat_config";

  var messagesEl = document.getElementById("messages");
  var emptyState = document.getElementById("emptyState");
  var composer = document.getElementById("composer");
  var input = document.getElementById("input");
  var sendBtn = document.getElementById("send");
  var settingsBtn = document.getElementById("settingsBtn");
  var settingsDialog = document.getElementById("settings");
  var apiKeyInput = document.getElementById("apiKey");
  var modelSelect = document.getElementById("model");
  var systemPromptInput = document.getElementById("systemPrompt");
  var saveSettingsBtn = document.getElementById("saveSettings");
  var clearChatBtn = document.getElementById("clearChat");

  var history = [];
  var config = { apiKey: "", model: "claude-sonnet-5", systemPrompt: "" };

  function loadConfig() {
    try {
      var raw = localStorage.getItem(CONFIG_KEY);
      if (raw) config = Object.assign(config, JSON.parse(raw));
    } catch (e) {}
    apiKeyInput.value = config.apiKey || "";
    modelSelect.value = config.model || "claude-sonnet-5";
    systemPromptInput.value = config.systemPrompt || "";
  }

  function saveConfig() {
    try { localStorage.setItem(CONFIG_KEY, JSON.stringify(config)); } catch (e) {}
  }

  function loadHistory() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) history = JSON.parse(raw);
    } catch (e) { history = []; }
  }

  function saveHistory() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(history)); } catch (e) {}
  }

  function renderAll() {
    messagesEl.innerHTML = "";
    if (history.length === 0) {
      messagesEl.appendChild(emptyState);
      return;
    }
    history.forEach(function (m) {
      appendBubble(m.role, m.content, false);
    });
    scrollToBottom();
  }

  function appendBubble(role, text, doScroll) {
    if (emptyState.parentNode) emptyState.remove();
    var div = document.createElement("div");
    div.className = "msg " + (role === "user" ? "user" : role === "error" ? "error" : "bot");
    div.textContent = text;
    messagesEl.appendChild(div);
    if (doScroll !== false) scrollToBottom();
    return div;
  }

  function appendTyping() {
    if (emptyState.parentNode) emptyState.remove();
    var div = document.createElement("div");
    div.className = "msg typing";
    div.innerHTML = "<span></span><span></span><span></span>";
    messagesEl.appendChild(div);
    scrollToBottom();
    return div;
  }

  function scrollToBottom() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function autoGrow() {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 140) + "px";
  }

  input.addEventListener("input", autoGrow);
  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      composer.requestSubmit();
    }
  });

  settingsBtn.addEventListener("click", function () {
    settingsDialog.showModal();
  });

  saveSettingsBtn.addEventListener("click", function () {
    config.apiKey = apiKeyInput.value.trim();
    config.model = modelSelect.value;
    config.systemPrompt = systemPromptInput.value.trim();
    saveConfig();
    settingsDialog.close();
  });

  clearChatBtn.addEventListener("click", function () {
    history = [];
    saveHistory();
    renderAll();
    settingsDialog.close();
  });

  if (!settingsDialog.showModal) {
    settingsBtn.style.display = "none";
  }

  composer.addEventListener("submit", async function (e) {
    e.preventDefault();
    var text = input.value.trim();
    if (!text) return;

    if (!config.apiKey) {
      appendBubble("error", "Please add your Anthropic API key in Settings first.");
      settingsDialog.showModal();
      return;
    }

    history.push({ role: "user", content: text });
    appendBubble("user", text);
    saveHistory();

    input.value = "";
    autoGrow();
    sendBtn.disabled = true;

    var typingEl = appendTyping();

    try {
      var reply = await callClaude();
      typingEl.remove();
      history.push({ role: "assistant", content: reply });
      appendBubble("bot", reply);
      saveHistory();
    } catch (err) {
      typingEl.remove();
      appendBubble("error", "Error: " + (err && err.message ? err.message : "request failed"));
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  });

  async function callClaude() {
    var body = {
      model: config.model || "claude-sonnet-5",
      max_tokens: 1024,
      messages: history.map(function (m) {
        return { role: m.role, content: m.content };
      })
    };
    if (config.systemPrompt) body.system = config.systemPrompt;

    var resp = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-api-key": config.apiKey,
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true"
      },
      body: JSON.stringify(body)
    });

    var data = await resp.json();
    if (!resp.ok) {
      var msg = (data && data.error && data.error.message) || ("HTTP " + resp.status);
      throw new Error(msg);
    }
    var parts = (data.content || []).filter(function (b) { return b.type === "text"; });
    return parts.map(function (b) { return b.text; }).join("\n") || "(empty response)";
  }

  loadConfig();
  loadHistory();
  renderAll();
})();
</script>
</body>
</html>
